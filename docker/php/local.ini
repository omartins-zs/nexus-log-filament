[PHP]
memory_limit = 512M
max_execution_time = 180
post_max_size = 128M
upload_max_filesize = 128M
variables_order = "EGPCS"
date.timezone = "America/Sao_Paulo"

; Error reporting
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Realpath Cache
; Fundamental para frameworks pesados (Laravel) reduzindo I/O em file mount
realpath_cache_size = 4096k
realpath_cache_ttl = 600

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; IMPORTANTE PARA AMBIENTE LOCAL (WINDOWS + DOCKER DESKTOP):
; Manter validate_timestamps ativado permite que alterações locais sejam percebidas
opcache.validate_timestamps=1
; Atraso de 0 segundos revalida a cada request (custo baixo na dev local, alto ganho dev experience)
opcache.revalidate_freq=0
opcache.fast_shutdown=1
