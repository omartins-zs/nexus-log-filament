[www]
; Configuração FPM Focada em Alta Performance e Redução de Gargalos
pm = dynamic

; Ajuste radical para evitar gargalo "server reached pm.max_children" (502 Gateway timeout)
; Permite processar mais requisições concorrentes sem que o worker seja dropado.
pm.max_children = 50

; Subimos com 10 já aquecidos para o primeiro hit (evita lentidão no carregamento inicial)
pm.start_servers = 10

; Mantém uma reserva ativa suficiente
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; Recicla processos para evitar memory leaks do PHP rodando indefinidamente
pm.max_requests = 1000

; Evita requests presos infinitamente matando o worker se ele travar
request_terminate_timeout = 180s

catch_workers_output = yes
decorate_workers_output = no
