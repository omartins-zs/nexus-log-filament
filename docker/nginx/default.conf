server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    index index.php index.html index.htm;
    charset utf-8;

    # Headers for stability
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolver dinâmico via Docker network interno para evitar nginx prender em IP antigo do FPM (causa de 502)
        # O timeout evita que o nginx trave infinitamente
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream app:9000;

        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Otimização de buffers para headers grandes (Laravel)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;

        # Timeouts estendidos para requests pesados
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
